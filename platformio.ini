; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-7 / 7B Hot Tub Controller
; Framework: Arduino-ESP32 with FreeRTOS, LVGL 8.3, AsyncWebServer, LittleFS, NimBLE

[platformio]
default_envs = esp32s3_waveshare_7in
data_dir = data

[env:esp32s3_waveshare_7in]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; CPU & Flash / PSRAM Configuration for Waveshare ESP32-S3 Touch LCD 7 (16MB Flash / 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, default
upload_speed = 921600

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc

lib_deps = 
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.0.4
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.1.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    tamcp/TAMC_GT911 @ ^1.0.2
